name: smart_canteen
description: "Aplikasi Pemesanan Kantin Sekolah Tanpa Antre"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # State Management
  provider: ^6.1.2

  # HTTP & Google Auth (untuk FCM HTTP v1 API tanpa Cloud Functions)
  http: ^1.2.2
  googleapis_auth: ^1.6.0

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.0
  badges: ^3.1.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/service_account.json
